# user-service-deployment-in-user-ns.yaml

# 1. ConfigMap: user-service에 필요한 모든 환경변수를 저장합니다.
# --------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: ai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-config
  namespace: ai
data:

  # .env 파일 내용
  DB_URL: "postgresql+asyncpg://user:1234@pgvector-service.database:5432/ai_fastapi_db"
  FOURKA_DB_HOST: "pgvector-service.database"
  FOURKA_DB_PORT: "5432"
  FOURKA_DB_NAME: "ai_fastapi_db"
  FOURKA_DB_USER: "user"
  FOURKA_DB_PASSWORD: "1234"

  # API Key 및 시크릿
  JWT_SECRET: ""
  GEMINI_API_KEY: "AIzaSyAEuOAmBpYVLqsmWVoI5UFRny515bfyQu0"

  # Bedrock 설정 (명확히 구분)
  BEDROCK_ACCESS_KEY_ID: "AKIA2BYS46JCJ5MBU76M"
  BEDROCK_SECRET_ACCESS_KEY: "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"
  BEDROCK_REGION_NAME: "ap-southeast-2"
  BEDROCK_EMBEDDING_MODEL_ID: "amazon.titan-embed-text-v2:0"
  BEDROCK_LLM_MODEL_ID: "anthropic.claude-3-haiku-20240307-v1:0"
  BEDROCK_GUARDRAIL_ID: "tyw9abrpgfd1"
  BEDROCK_GUARDRAIL_VERSION: "1"

