  DEBUG: "True"
  API_PREFIX: "/api"
  TIMEZONE_LOCATION: "Asia/Seoul"
  REDIS_URL: "redis://redis-persistent-service.database:6379"

 

  # S3 Credentials (카카오클라우드)
  S3_BUCKET_NAME: "fourka-1"
  S3_REGION_NAME: "kr-central-2"
  S3_ACCESS_KEY_ID: "431aab244d984c819e19ab5016698c16"
  S3_SECRET_ACCESS_KEY: "65d5f1e1a24143919648157e873f8090"
  S3_ENDPOINT_URL: "https://objectstorage.kr-central-2.kakaoi.io"
  S3_PROJECT_ID: "f69598a574dc4a76a6711bb4ea074d67"

---
# 2. Deployment: user-service 애플리케이션을 배포하고 관리합니다.
# --------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-deployment
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      containers:
        - name: ai-container
          image: msj9965/fourkachip-ai:0.0.4
          ports:
            - containerPort: 8000 # 애플리케이션이 사용하는 포트
          envFrom:
            - configMapRef:
                name: ai-config # 같은 'ai' 네임스페이스 내의 ConfigMap 참조
---
# 3. Service: ai에 대한 안정적인 네트워크 진입점을 생성합니다.
# --------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: ai
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: ai