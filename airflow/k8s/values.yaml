# Airflow Helm Chart Values for Kubernetes
# 사용: helm install airflow apache-airflow/airflow -f values.yaml

# Airflow 기본 설정
airflow:
  # 이미지 설정
  image:
    repository: apache/airflow
    tag: "2.7.0"
    pullPolicy: IfNotPresent
  
  # Executor 설정 (쿠버네티스용)
  executor: "KubernetesExecutor"  # Docker Compose에서는 LocalExecutor
  
  # Configuration
  config:
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    
     # === 동시성: 아주 낮게 캡 ===
    AIRFLOW__CORE__PARALLELISM: "2"                 # 클러스터 전체 동시 태스크
    AIRFLOW__SCHEDULER__MAX_TIS_PER_QUERY: "8"      # 스케줄러가 한 번에 집는 TI 수 완화

    # === 스케줄러 절약형 ===
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "60"   # DAG 파싱 최소 간격↑
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "120"      # DAG 디렉토리 스캔 주기↑
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "60"

    # 쿠버네티스 전용 설정
    AIRFLOW__KUBERNETES__NAMESPACE: "airflow"
    AIRFLOW__KUBERNETES__WORKER_CONTAINER_REPOSITORY: "apache/airflow"
    AIRFLOW__KUBERNETES__WORKER_CONTAINER_TAG: "2.7.0"
    AIRFLOW__KUBERNETES__DELETE_WORKER_PODS: "true"

    # === Worker(태스크 파드) 소형화 ===
    AIRFLOW__KUBERNETES__WORKER_REQUEST_CPU: "50m"
    AIRFLOW__KUBERNETES__WORKER_REQUEST_MEMORY: "128Mi"
    AIRFLOW__KUBERNETES__WORKER_LIMIT_CPU: "300m"
    AIRFLOW__KUBERNETES__WORKER_LIMIT_MEMORY: "512Mi"

    # === Webserver 초소형(거의 안 씀 가정) ===
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__WEBSERVER__WORKER_CLASS: "sync"

# 데이터베이스 설정 (외부 PostgreSQL 사용)
postgresql:
  enabled: false  # 내장 DB 비활성화
  
# 외부 데이터베이스 연결
externalDatabase:
  type: postgres
  host: "fourka-postgres-service"  # 쿠버네티스 서비스명
  port: 5432
  database: "airflow_metadata"
  user: "vectoruser"
  passwordSecret: "airflow-db-secret"
  passwordSecretKey: "password"

# Redis (CeleryExecutor 사용 시 필요, KubernetesExecutor는 불필요)
redis:
  enabled: false

# PVC 설정 (DAGs, Logs 공유용)
persistence:
  enabled: true
  storageClass: "standard"  # 클러스터에 맞게 수정
  accessMode: ReadWriteMany
  size: 10Gi

  # 컴포넌트 리소스 (아주 보수적으로)
webserver:
  service:
    type: ClusterIP
    port: 8085
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 150m
      memory: 256Mi
    # priorityClassName: "low-priority"   # (옵션) 낮은 우선순위 클래스 있으면 지정

scheduler:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# 환경변수 (Secret으로 관리)
env:
  - name: AIRFLOW_CONN_FOURKA_DB
    valueFrom:
      secretKeyRef:
        name: fourka-db-secret
        key: connection-string

# DAGs 동기화 (Git 또는 S3 사용)
dags:
  gitSync:
    enabled: false
    # Git 동기화 비활성화로 로컬 DAG 파일 사용
  persistence:
    enabled: true
    # 로컬 DAG 파일을 컨테이너에 마운트