# Kubernetes Secrets for Airflow
apiVersion: v1
kind: Secret
metadata:
  name: fourka-db-secret
  namespace: airflow
type: Opaque
stringData:
  # FourKa 메인 DB 연결 정보
  connection-string: "postgres://vectoruser:pgvectorpassword@fourka-postgres-service:5432/ai_fastapi_db"
  
  # 개별 환경변수들
  FOURKA_DB_HOST: "fourka-postgres-service.database.svc.cluster.local"
  FOURKA_DB_PORT: "5432"
  FOURKA_DB_NAME: "ai_fastapi_db"
  FOURKA_DB_USER: "vectoruser"
  FOURKA_DB_PASSWORD: "pgvectorpassword"

---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-db-secret
  namespace: airflow
type: Opaque
stringData:
  # Airflow 메타데이터 DB 연결 정보 (기존 PostgreSQL 사용)
  password: "pgvectorpassword"
  connection-string: "postgresql+psycopg2://vectoruser:pgvectorpassword@fourka-postgres-service:5432/airflow_metadata"

---
# 이메일 알림용 (선택적)
apiVersion: v1
kind: Secret
metadata:
  name: airflow-email-secret
  namespace: airflow
type: Opaque
stringData:
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "data-team@company.com"
  SMTP_PASSWORD: "your-app-password"
