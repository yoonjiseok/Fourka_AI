name: CI - FastAPI Docker Build & Push to Kakao Container Registry

on:
  push:
    branches:
      - develop

env:
  REPO: fourka
  IMAGE_NAME: fourka-ai
  IMAGE_TAG: ${{ github.ref_name }}-${{ github.run_number }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v3

      # 2. REPO 이름을 소문자로 변경
      - name: Set lowercase REPO
        run: echo "REPO_LC=${REPO,,}" >> $GITHUB_ENV
        env:
          REPO: ${{ env.REPO }}

      # 3. 카카오 컨테이너 레지스트리에 로그인
      - name: Log in to Kakao Container Registry
        run: echo "${{ secrets.KCR_PASSWORD }}" | docker login ${{ secrets.KCR_PROJECT }}.${{ secrets.KCR_REGION }}.kcr.dev -u ${{ secrets.KCR_USERNAME }} --password-stdin

      # 4. Dockerfile을 사용하여 이미지 빌드 및 푸시
      # (Dockerfile 내부에서 모든 빌드 과정이 처리됩니다)
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.KCR_PROJECT }}.${{ secrets.KCR_REGION }}.kcr.dev/${{ env.REPO_LC }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.KCR_PROJECT }}.${{ secrets.KCR_REGION }}.kcr.dev/${{ env.REPO_LC }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # 5. Jenkins CD 파이프라인 트리거
      - name: Trigger Jenkins CD Pipeline
        if: success()
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_JOB_NAME: ${{ secrets.JENKINS_JOB_NAME }}
          JENKINS_TRIGGER_TOKEN: ${{ secrets.JENKINS_TRIGGER_TOKEN }}
          IMAGE_TO_DEPLOY: ${{ secrets.KCR_PROJECT }}.${{ secrets.KCR_REGION }}.kcr.dev/${{ env.REPO_LC }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          JENKINS_USER_ID: ${{ secrets.JENKINS_USER_ID }}
          JENKINS_USER_API_TOKEN: ${{ secrets.JENKINS_USER_API_TOKEN }}
          APP_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Triggering Jenkins job: ${JENKINS_JOB_NAME} with image: ${IMAGE_TO_DEPLOY}"
          curl -X POST -u "${JENKINS_USER_ID}:${JENKINS_USER_API_TOKEN}" \
            "${JENKINS_URL}/job/${JENKINS_JOB_NAME}/buildWithParameters?token=${JENKINS_TRIGGER_TOKEN}&FULL_IMAGE_NAME=${IMAGE_TO_DEPLOY}&APP_REPO_URL=${APP_REPO_URL}&GIT_COMMIT_SHA=${GIT_COMMIT_SHA}"
